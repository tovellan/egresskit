name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks
        env:
          GOBIN: ${{ runner.temp }}/gitleaks-bin
        run: go install github.com/zricethezav/gitleaks/v8@83d9cd684c87d95d656c1458ef04895a7f1cbd8e
      - name: Scan complete Git history
        run: |
          "${{ runner.temp }}/gitleaks-bin/gitleaks" git . --redact --no-banner
