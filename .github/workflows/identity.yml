name: Commit identity

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to audit
        required: true
        type: number

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  audit:
    name: trusted identity audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
      - run: >-
          python3 -m scripts.commit_identity_audit
          --check-pull-request "$PULL_REQUEST_NUMBER"
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
