name: Release build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version without the v prefix
        required: true
        type: string
      expected_head:
        description: Exact 40-character main commit SHA
        required: true
        type: string

permissions:
  attestations: read
  contents: write

concurrency:
  group: protected-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.10.2"
          enable-cache: false
      - run: uv python install 3.12
      - run: uv sync --all-groups --locked --python 3.12
      - name: Validate exact release target
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release version must be a three-part numeric version" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release head must be a lowercase 40-character commit SHA" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_HEAD" ]]; then
            echo "release head does not match checked-out main" >&2
            exit 1
          fi
          package_version="$(uv run --python 3.12 python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$package_version" != "$VERSION" ]]; then
            echo "release version does not match package metadata" >&2
            exit 1
          fi
      - run: make ci
      - name: Create release checksums
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          wheel="egresskit-${VERSION}-py3-none-any.whl"
          sdist="egresskit-${VERSION}.tar.gz"
          (
            cd dist
            sha256sum "$wheel" "$sdist" > SHA256SUMS
            mapfile -t checksum_names < <(awk '{print $2}' SHA256SUMS)
            if [[ "${#checksum_names[@]}" != 2 || \
                  "${checksum_names[0]}" != "$wheel" || \
                  "${checksum_names[1]}" != "$sdist" ]]; then
              echo "checksum manifest has unexpected entries or ordering" >&2
              exit 1
            fi
            sha256sum --check --strict SHA256SUMS
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: egresskit-dist-${{ inputs.version }}
          path: |
            dist/egresskit-${{ inputs.version }}-py3-none-any.whl
            dist/egresskit-${{ inputs.version }}.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Create exact annotated tag and verified release draft
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          tag="v${VERSION}"
          wheel="egresskit-${VERSION}-py3-none-any.whl"
          sdist="egresskit-${VERSION}.tar.gz"
          release_body="EgressKit $tag release with exact checksums. See CHANGELOG.md for details."
          expected_assets="$(jq -cn \
            --arg wheel "$wheel" \
            --arg sdist "$sdist" \
            '["SHA256SUMS", $sdist, $wheel] | sort')"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$remote_main" != "$EXPECTED_HEAD" ]]; then
            echo "main changed during release verification" >&2
            exit 1
          fi
          remote_tag="$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}')"
          if [[ -n "$remote_tag" ]] && \
             ! git show-ref --verify --quiet "refs/tags/$tag"; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [[ "$(git cat-file -t "$tag")" != "tag" ]]; then
              echo "existing release tag is not annotated" >&2
              exit 1
            fi
            tag_object="$(git cat-file -p "$tag")"
            if [[ "$(sed -n '1p' <<<"$tag_object")" != \
                    "object $EXPECTED_HEAD" || \
                  "$(sed -n '2p' <<<"$tag_object")" != "type commit" || \
                  "$(sed -n '3p' <<<"$tag_object")" != "tag $tag" ]]; then
              echo "existing release tag has invalid target metadata" >&2
              exit 1
            fi
            tagger="$(git for-each-ref \
              --format='%(taggername)|%(taggeremail)' "refs/tags/$tag")"
            if [[ "$tagger" != \
              'Tovellan Maintainers|<tovellan@users.noreply.github.com>' ]]; then
              echo "existing release tag has invalid tagger metadata" >&2
              exit 1
            fi
            tag_message="$(git for-each-ref \
              --format='%(contents)' "refs/tags/$tag")"
            if [[ "$tag_message" != "EgressKit $tag" ]]; then
              echo "existing release tag has invalid message or signature data" >&2
              exit 1
            fi
          else
            if [[ -n "$remote_tag" ]]; then
              echo "remote release tag could not be loaded exactly" >&2
              exit 1
            fi
            git -c user.name='Tovellan Maintainers' \
              -c user.email='tovellan@users.noreply.github.com' \
              tag -a "$tag" -m "EgressKit $tag" "$EXPECTED_HEAD"
            git push origin "refs/tags/$tag"
          fi
          remote_release="$(git ls-remote origin "refs/tags/$tag^{}" | awk '{print $1}')"
          if [[ "$remote_release" != "$EXPECTED_HEAD" ]]; then
            echo "remote annotated tag does not peel to the expected commit" >&2
            exit 1
          fi

          (
            cd dist
            mapfile -t checksum_names < <(awk '{print $2}' SHA256SUMS)
            if [[ "${#checksum_names[@]}" != 2 || \
                  "${checksum_names[0]}" != "$wheel" || \
                  "${checksum_names[1]}" != "$sdist" ]]; then
              echo "checksum manifest changed before draft upload" >&2
              exit 1
            fi
            sha256sum --check --strict SHA256SUMS
          )

          wheel_digest="sha256:$(sha256sum "dist/$wheel" | awk '{print $1}')"
          sdist_digest="sha256:$(sha256sum "dist/$sdist" | awk '{print $1}')"
          sums_digest="sha256:$(sha256sum dist/SHA256SUMS | awk '{print $1}')"
          releases_json="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          matching_releases="$(jq -c --arg tag "$tag" \
            '[.[][] | select(.tag_name == $tag)]' <<<"$releases_json")"
          release_count="$(jq 'length' <<<"$matching_releases")"
          if [[ "$release_count" -gt 1 ]]; then
            echo "multiple releases unexpectedly use the exact tag" >&2
            exit 1
          fi

          if [[ "$release_count" == 0 ]]; then
            gh release create "$tag" \
              "dist/$wheel" \
              "dist/$sdist" \
              dist/SHA256SUMS \
              --draft \
              --verify-tag \
              --target "$EXPECTED_HEAD" \
              --title "$tag" \
              --notes "$release_body"
          else
            release_json="$(jq -c '.[0]' <<<"$matching_releases")"
            if jq -e '.draft == false and .immutable == true' \
              <<<"$release_json" >/dev/null; then
              published_assets="$(jq -c \
                '[.assets[].name] | sort' <<<"$release_json")"
              jq -e \
                --arg body "$release_body" \
                --arg head "$EXPECTED_HEAD" \
                --arg tag "$tag" \
                --arg wheel "$wheel" \
                --arg wheel_digest "$wheel_digest" \
                --arg sdist "$sdist" \
                --arg sdist_digest "$sdist_digest" \
                --arg sums_digest "$sums_digest" \
                '([.assets[] | {key: .name, value: .digest}] | from_entries) as $digests |
                 (.tag_name == $tag and
                  .target_commitish == $head and
                  .name == $tag and
                  .body == $body and
                  .draft == false and
                  .prerelease == false and
                  .immutable == true and
                  (.assets | length) == 3 and
                  ([.assets[].name] | unique | length) == 3 and
                  ([.assets[].state] | all(. == "uploaded")) and
                  $digests[$wheel] == $wheel_digest and
                  $digests[$sdist] == $sdist_digest and
                  $digests["SHA256SUMS"] == $sums_digest)' \
                <<<"$release_json" >/dev/null
              if [[ "$published_assets" != "$expected_assets" ]]; then
                echo "immutable release has unexpected asset names" >&2
                exit 1
              fi
              gh release verify "$tag" --format json >/dev/null
              exit 0
            fi
            if ! jq -e \
              --arg body "$release_body" \
              --arg head "$EXPECTED_HEAD" \
              --arg tag "$tag" \
              '.tag_name == $tag and
               .target_commitish == $head and
               .name == $tag and
               .body == $body and
               .draft == true and
               .prerelease == false and
               .immutable == false' \
              <<<"$release_json" >/dev/null; then
              echo "existing release is neither the exact draft nor an immutable release" >&2
              exit 1
            fi
            existing_assets="$(jq -c '[.assets[].name] | sort' \
              <<<"$release_json")"
            if ! jq -e --argjson expected "$expected_assets" \
              'all(.[]; . as $name | $expected | index($name)) and
               (unique | length) == length' \
              <<<"$existing_assets" >/dev/null; then
              echo "existing release draft has unexpected or duplicate assets" >&2
              exit 1
            fi
            gh release upload "$tag" \
              "dist/$wheel" \
              "dist/$sdist" \
              dist/SHA256SUMS \
              --clobber
          fi

          final_releases_json="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          final_matching_releases="$(jq -c --arg tag "$tag" \
            '[.[][] | select(.tag_name == $tag)]' <<<"$final_releases_json")"
          if [[ "$(jq 'length' <<<"$final_matching_releases")" != 1 ]]; then
            echo "exact release draft could not be reloaded" >&2
            exit 1
          fi
          release_json="$(jq -c '.[0]' <<<"$final_matching_releases")"
          draft_assets="$(jq -c '[.assets[].name] | sort' <<<"$release_json")"
          if [[ "$draft_assets" != "$expected_assets" ]]; then
            echo "release draft has unexpected asset names" >&2
            exit 1
          fi
          jq -e \
            --arg body "$release_body" \
            --arg head "$EXPECTED_HEAD" \
            --arg tag "$tag" \
            --arg wheel "$wheel" \
            --arg wheel_digest "$wheel_digest" \
            --arg sdist "$sdist" \
            --arg sdist_digest "$sdist_digest" \
            --arg sums_digest "$sums_digest" \
            '([.assets[] | {key: .name, value: .digest}] | from_entries) as $digests |
             (.tag_name == $tag and
              .target_commitish == $head and
              .name == $tag and
              .body == $body and
              .draft == true and
              .prerelease == false and
              .immutable == false and
              (.assets | length) == 3 and
              ([.assets[].name] | unique | length) == 3 and
              ([.assets[].state] | all(. == "uploaded")) and
              $digests[$wheel] == $wheel_digest and
              $digests[$sdist] == $sdist_digest and
              $digests["SHA256SUMS"] == $sums_digest)' \
            <<<"$release_json" >/dev/null
