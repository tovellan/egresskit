name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.10.2"
          enable-cache: false
      - run: uv python install "${{ matrix.python-version }}"
      - run: uv sync --all-groups --locked --python "${{ matrix.python-version }}"
      - run: make ci
        env:
          EGRESSKIT_IDENTITY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
