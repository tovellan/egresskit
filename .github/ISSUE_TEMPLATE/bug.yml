name: Bug report
description: Report a reproducible EgressKit defect using synthetic data.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: EgressKit version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Do not include real payloads, credentials, or personal data.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: This report contains synthetic data only.
          required: true
        - label: This is not a security vulnerability.
          required: true
