[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "egresskit"
version = "0.5.0"
description = "Fail-closed policy checks before Python applications serialize or send external payloads"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Tovellan maintainers" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
httpx = ["httpx>=0.27,<1"]

[project.urls]
Documentation = "https://github.com/tovellan/egresskit/tree/main/docs"
Issues = "https://github.com/tovellan/egresskit/issues"
Repository = "https://github.com/tovellan/egresskit"

[project.scripts]
egresskit = "egresskit.cli:main"

[dependency-groups]
dev = [
  "build>=1.2.2,<2",
  "hypothesis>=6.127,<7",
  "httpx>=0.27,<1",
  "mypy>=1.15,<2",
  "pip-audit>=2.8,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/egresskit"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "N", "PERF", "PIE", "PT", "PTH", "RUF", "S", "SIM", "UP"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"scripts/check_text.py" = ["S603"]
"scripts/repository_audit.py" = ["S603"]
"src/egresskit/errors.py" = ["N818"]
"tests/**/*.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["egresskit"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=egresskit --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
